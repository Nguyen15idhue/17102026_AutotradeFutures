# Mock Binance USDⓈ-M Futures — dùng cho dev/test offline.
#
# Quy ước (xem AGENTS.md):
#   docker compose up -d                          -> chỉ mock (dev, CI)
#   docker compose --profile app up -d            -> mock + engine + dashboard
#
# KHÔNG dùng env_file: .env ở đây: file đó chứa secret Binance thật và mock không cần.
# Engine/dashboard sẽ dùng hostname nội bộ `binance-demo-server:8080`
# (KHÔNG phải 127.0.0.1:8081 — đó chỉ là cổng debug map ra host).

services:
  binance-demo-server:
    # Không khai báo `profiles` => luôn chạy, ở cả chế độ mặc định và `--profile app`.
    build: ./mock/binance-demo-server
    container_name: binance-demo-server
    environment:
      TZ: UTC
      MARKET_MODE: ${MOCK_MARKET_MODE:-proxy}          # proxy | replay | synthetic
      UPSTREAM: ${MOCK_UPSTREAM:-https://fapi.binance.com}
      FIXTURES_DIR: /app/fixtures
      SEED: ${MOCK_SEED:-42}
      SPEED: ${MOCK_SPEED:-1}
      INITIAL_BALANCE: ${MOCK_INITIAL_BALANCE:-5000}
      FEE_MAKER_BPS: "2"
      FEE_TAKER_BPS: "5"
      FILL_MODEL: pessimistic                           # pessimistic | optimistic
      SLIPPAGE_BPS: "5"
      AUTH_STRICT: "true"
      FAIL_RATE: "0"
      LOG_LEVEL: INFO
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - mockdata:/app/data
      - ./mock/fixtures:/app/fixtures:ro
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 256m
    cpus: "0.5"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/fapi/v1/ping',timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Phase 1 (P1.0 skeleton): chay bang --profile app. Local only, chua VPS.
  engine:
    profiles: ["app"]
    build: ./engine
    container_name: bot-engine
    environment:
      TZ: UTC
      BINANCE_BASE_URL: http://binance-demo-server:8080
      BINANCE_WS_URL: ws://binance-demo-server:8080/ws
    volumes:
      - botdata:/app/data
      - ./config:/app/config:ro   # config/mvp.*.yaml: single source of truth, khong bake vao image
    depends_on:
      binance-demo-server:
        condition: service_healthy
    restart: unless-stopped
    init: true

  dashboard:
    profiles: ["app"]
    build: ./dashboard
    container_name: bot-dashboard
    environment:
      TZ: UTC
      DB_PATH: /app/data/bot.db
    volumes:
      - botdata:/app/data:ro
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    tmpfs:
      - /tmp

  # P1.1.1: soak 72h. Chay: mock + soak (KHONG chay engine de tranh HALT oan).
  soak:
    profiles: ["app"]
    build: ./engine
    container_name: bot-soak
    command: ["python", "-m", "app.soak",
              "--minutes", "4320", "--cycles", "25", "--drops", "5",
              "--report", "/app/data/soak-report.json",
              "--status", "/app/data/soak-status.json"]
    environment:
      TZ: UTC
      SOAK_BASE_URL: http://binance-demo-server:8080
      SOAK_COMMIT: ${SOAK_COMMIT:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_TOPIC_ID: ${TELEGRAM_TOPIC_ID:-}
    volumes:
      - botdata:/app/data
    depends_on:
      binance-demo-server:
        condition: service_healthy
    restart: "no"
    init: true

volumes:
  mockdata:
  botdata:
